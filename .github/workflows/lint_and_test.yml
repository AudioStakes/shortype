name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check
        run: yarn check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
